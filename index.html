<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <header>
        <img src="logo.png" alt="Logo" id="logo">
        <h1>
            Lista de Compras -
            <select id="daySelector"></select>
        </h1>
    </header>

    <div id="login-container">
        <form id="login-form">
            <h2>Login</h2>
            <input type="text" id="username" placeholder="Usuário" required>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
            <p id="login-error" class="error-message">Usuário ou senha inválidos!</p>
        </form>
    </div>

    <div id="product-list-container" style="display:none;">
        <div id="product-list"></div>

        <button id="generate-report">GERAR RELATÓRIO</button>
        <button id="clear-selection">LIMPAR SELEÇÃO</button>
        <textarea id="report" rows="10" cols="50" placeholder="O relatório será gerado aqui..." readonly></textarea>
        <button id="copy-report">COPIAR RELATÓRIO</button>
        <button id="logout-btn">SAIR</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
